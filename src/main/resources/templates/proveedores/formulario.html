
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Formulario de proveedores')}"></head>

<body>

    <!-- Menú lateral reutilizable de SIVET. -->
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">

        <!-- Barra superior compartida. -->
        <header th:replace="~{fragments/layout :: topbar('Formulario de proveedores')}"></header>

        <section class="page-content">

            <!-- Encabezado dinámico del formulario. -->
            <div class="mb-4">

                <h3 class="fw-bold mb-1"
                    th:text="${proveedor.id == null ? 'Registrar proveedor' : 'Editar proveedor'}">
                    Registrar proveedor
                </h3>

                <p class="text-muted mb-0">
                    Completa los datos de contacto del proveedor.
                </p>

            </div>

            <!-- Panel del formulario. -->
            <div class="sivet-card">

                <!-- Formulario de registro o actualización. -->
                <form th:action="${proveedor.id == null} ? @{/proveedores/guardar} : @{/proveedores/actualizar/{id}(id=${proveedor.id})}"
                      th:object="${proveedor}"
                      method="post">

                    <!-- Mensaje de error del servidor. -->
                    <div th:if="${mensajeError}"
                         class="alert alert-danger alert-dismissible fade show"
                         role="alert">

                        <i class="bi bi-exclamation-triangle me-2"></i>

                        <span th:text="${mensajeError}"></span>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Cerrar">
                        </button>

                    </div>

                    <div class="row g-3">

                        <!-- Nombre o razón social. -->
                        <div class="col-md-6">

                            <label for="nombre" class="form-label fw-semibold">
                                Nombre o razón social *
                            </label>

                            <input type="text"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   minlength="2"
                                   maxlength="120"
                                   placeholder="Nombre del proveedor"
                                   autocomplete="organization"
                                   required>

                        </div>

                        <!-- RUC o documento. -->
                        <div class="col-md-6">

                            <label for="numeroDocumento" class="form-label fw-semibold">
                                RUC o documento
                            </label>

                            <input type="text"
                                   id="numeroDocumento"
                                   th:field="*{numeroDocumento}"
                                   class="form-control"
                                   maxlength="20"
                                   placeholder="Número de documento"
                                   autocomplete="off">

                        </div>

                        <!-- Teléfono. -->
                        <div class="col-md-6">

                            <label for="telefono" class="form-label fw-semibold">
                                Teléfono
                            </label>

                            <input type="tel"
                                   id="telefono"
                                   th:field="*{telefono}"
                                   class="form-control"
                                   maxlength="20"
                                   placeholder="Número de contacto"
                                   autocomplete="tel">

                        </div>

                        <!-- Correo electrónico. -->
                        <div class="col-md-6">

                            <label for="correo" class="form-label fw-semibold">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   id="correo"
                                   th:field="*{correo}"
                                   class="form-control"
                                   maxlength="100"
                                   placeholder="correo@ejemplo.com"
                                   autocomplete="email">

                        </div>

                        <!-- Dirección. -->
                        <div class="col-12">

                            <label for="direccion" class="form-label fw-semibold">
                                Dirección
                            </label>

                            <textarea id="direccion"
                                      th:field="*{direccion}"
                                      class="form-control"
                                      rows="3"
                                      maxlength="200"
                                      placeholder="Dirección del proveedor">
                            </textarea>

                        </div>

                    </div>

                    <!-- Separador visual. -->
                    <hr class="my-4">

                    <!-- Acciones del formulario. -->
                    <div class="d-flex flex-wrap justify-content-end gap-2">

                        <a th:href="@{/proveedores}"
                           class="btn btn-outline-secondary">

                            <i class="bi bi-arrow-left me-1"></i>
                            Cancelar

                        </a>

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-save me-1"></i>

                            <span th:text="${proveedor.id == null ? 'Registrar proveedor' : 'Guardar cambios'}">
                                Guardar
                            </span>

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <!-- Scripts compartidos de SIVET. -->
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
