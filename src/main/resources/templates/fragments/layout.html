
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">

    <!-- Configuración básica de la página. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo + ' | SIVET'}">SIVET</title>

    <!-- Bootstrap 5.3.2. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Iconos de Bootstrap. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Estilos propios de SIVET. -->
    <link rel="stylesheet" th:href="@{/css/sivet.css}">

    <!-- Estilos para los mensajes de validación personalizados. -->
    <style>
        .campo-error {
            display: block;
            color: #dc3545;
            font-size: 0.82rem;
            margin-top: 5px;
        }

        .campo-invalido {
            border-color: #dc3545 !important;
        }

        .campo-invalido:focus {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.15) !important;
        }

        .campo-valido {
            border-color: #198754 !important;
        }
    </style>

</head>

<body>

    <!-- Menú lateral principal de SIVET. -->
    <aside th:fragment="sidebar" class="sidebar">

        <!-- Identidad visual del sistema. -->
        <div class="sidebar-logo">
            <i class="bi bi-shop"></i>

            <div>
                <h2>SIVET</h2>
                <span>Sistema de Inventario y Ventas</span>
            </div>
        </div>

        <!-- Navegación principal. -->
        <div class="sidebar-section">PRINCIPAL</div>

        <nav class="sidebar-menu">

            <a th:href="@{ / }" class="sidebar-link" data-route="/">
                <i class="bi bi-grid-fill"></i>
                <span>Dashboard</span>
            </a>

        </nav>

        <!-- Opciones exclusivas del administrador. -->
        <div sec:authorize="hasRole('ADMIN')">

            <div class="sidebar-section">ADMINISTRACIÓN</div>

            <nav class="sidebar-menu">

                <a th:href="@{/usuarios}" class="sidebar-link" data-route="/usuarios">
                    <i class="bi bi-people"></i>
                    <span>Usuarios</span>
                </a>

                <a th:href="@{/roles}" class="sidebar-link" data-route="/roles">
                    <i class="bi bi-person-badge"></i>
                    <span>Roles</span>
                </a>

                <a th:href="@{/reportes}" class="sidebar-link" data-route="/reportes">
                    <i class="bi bi-bar-chart-fill"></i>
                    <span>Reportes</span>
                </a>

            </nav>

        </div>

        <!-- Opciones del administrador y almacenero. -->
        <div sec:authorize="hasAnyRole('ADMIN', 'ALMACENERO')">

            <div class="sidebar-section">INVENTARIO Y COMPRAS</div>

            <nav class="sidebar-menu">

                <a th:href="@{/productos}" class="sidebar-link" data-route="/productos">
                    <i class="bi bi-box-seam"></i>
                    <span>Productos</span>
                </a>

                <a th:href="@{/categorias}" class="sidebar-link" data-route="/categorias">
                    <i class="bi bi-tags"></i>
                    <span>Categorías</span>
                </a>

                <a th:href="@{/proveedores}" class="sidebar-link" data-route="/proveedores">
                    <i class="bi bi-truck"></i>
                    <span>Proveedores</span>
                </a>

                <a th:href="@{/compras}" class="sidebar-link" data-route="/compras">
                    <i class="bi bi-bag"></i>
                    <span>Compras</span>
                </a>

                <a th:href="@{/movimientos}" class="sidebar-link" data-route="/movimientos">
                    <i class="bi bi-boxes"></i>
                    <span>Movimientos</span>
                </a>

            </nav>

        </div>

        <!-- Opciones del administrador y vendedor. -->
        <div sec:authorize="hasAnyRole('ADMIN', 'VENDEDOR')">

            <div class="sidebar-section">VENTAS Y CLIENTES</div>

            <nav class="sidebar-menu">

                <a th:href="@{/clientes}" class="sidebar-link" data-route="/clientes">
                    <i class="bi bi-person-lines-fill"></i>
                    <span>Clientes</span>
                </a>

                <a th:href="@{/ventas}" class="sidebar-link" data-route="/ventas">
                    <i class="bi bi-cart3"></i>
                    <span>Ventas</span>
                </a>

            </nav>

        </div>

        <!-- Información del sistema. -->
        <div class="sidebar-footer">

            <i class="bi bi-shop"></i>

            <p class="mb-0 mt-2">Tu bodega, siempre organizada</p>
            <small>SIVET © 2026</small>

        </div>

    </aside>

    <!-- Barra superior reutilizable. -->
    <header th:fragment="topbar(titulo)" class="topbar">

        <div>
            <h5 class="mb-0 fw-bold" th:text="${titulo}">
                Dashboard
            </h5>
        </div>

        <div class="d-flex align-items-center gap-3">

            <!-- Nombre del usuario autenticado. -->
            <div class="text-end">

                <span class="d-block fw-semibold"
                      sec:authentication="name">
                    Usuario
                </span>

                <!-- Autoridades asignadas a la sesión. -->
                <small class="text-muted"
                       sec:authentication="principal.authorities">
                    Rol
                </small>

            </div>

            <!-- Formulario para cerrar sesión. -->
            <form th:action="@{/logout}" method="post" class="m-0">

                <button type="submit" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Salir
                </button>

            </form>

        </div>

    </header>

    <!-- Scripts generales de Bootstrap, navegación y validaciones. -->
    <th:block th:fragment="scripts">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>

            // Espera a que el documento esté completamente cargado.
            document.addEventListener("DOMContentLoaded", function () {

                // Obtiene la ruta actual del navegador.
                const rutaActual = window.location.pathname;

                // Obtiene los enlaces disponibles en el menú lateral.
                const enlaces = document.querySelectorAll(
                    ".sidebar-link[data-route]"
                );

                // Recorre los enlaces para identificar el módulo actual.
                enlaces.forEach(function (enlace) {

                    // Obtiene la ruta asociada al enlace.
                    const ruta = enlace.getAttribute("data-route");

                    // Activa el dashboard solamente en la ruta principal.
                    if (ruta === "/" && rutaActual === "/") {
                        enlace.classList.add("active");
                        return;
                    }

                    // Activa el módulo cuando se visita una de sus subrutas.
                    if (
                        ruta !== "/" &&
                        (rutaActual === ruta || rutaActual.startsWith(ruta + "/"))
                    ) {
                        enlace.classList.add("active");
                    }

                });

                // Selecciona los formularios que no solicitan validación nativa.
                const formularios = document.querySelectorAll("form:not([data-native-validation])");

                // Configura las validaciones personalizadas de cada formulario.
                formularios.forEach(function (formulario) {

                    // Desactiva los avisos automáticos del navegador.
                    formulario.setAttribute("novalidate", "novalidate");

                    // Comprueba los campos antes de enviar el formulario.
                    formulario.addEventListener("submit", function (evento) {

                        let primerCampoInvalido = null;

                        // Obtiene los campos que pueden validarse.
                        const campos = formulario.querySelectorAll(
                            "input, select, textarea"
                        );

                        // Recorre todos los campos del formulario.
                        campos.forEach(function (campo) {

                            // Ignora campos deshabilitados, ocultos y botones.
                            if (
                                campo.disabled ||
                                campo.type === "hidden" ||
                                campo.type === "submit" ||
                                campo.type === "button" ||
                                campo.type === "reset"
                            ) {
                                return;
                            }

                            // Valida el campo y muestra el mensaje correspondiente.
                            validarCampo(campo);

                            // Guarda el primer campo que tenga errores.
                            if (!campo.checkValidity() && primerCampoInvalido === null) {
                                primerCampoInvalido = campo;
                            }

                        });

                        // Impide el envío si existe algún campo inválido.
                        if (primerCampoInvalido !== null) {

                            evento.preventDefault();

                            // Lleva al usuario al primer campo que necesita corregir.
                            primerCampoInvalido.focus();

                            // Desplaza la página hasta el campo con el error.
                            primerCampoInvalido.scrollIntoView({
                                behavior: "smooth",
                                block: "center"
                            });
                        }

                    });

                    // Revisa los campos cuando el usuario modifica su contenido.
                    formulario.addEventListener("input", function (evento) {

                        if (evento.target.matches("input, textarea")) {
                            validarCampo(evento.target);
                        }

                    });

                    // Revisa los campos de selección.
                    formulario.addEventListener("change", function (evento) {

                        if (evento.target.matches("select, input[type='checkbox'], input[type='radio']")) {
                            validarCampo(evento.target);
                        }

                    });

                });

                // Genera y muestra mensajes personalizados para cada campo.
                function validarCampo(campo) {

                    // Ignora los campos que no participan en la validación.
                    if (
                        campo.disabled ||
                        campo.type === "hidden" ||
                        campo.type === "submit" ||
                        campo.type === "button" ||
                        campo.type === "reset"
                    ) {
                        return;
                    }

                    // Identifica el contenedor del campo.
                    let contenedor = campo.parentElement;

                    // Busca el contenedor Bootstrap del campo.
                    if (!contenedor) {
                        return;
                    }

                    // Recupera o crea el espacio para el mensaje.
                    let mensaje = contenedor.querySelector(
                        ":scope > .campo-error"
                    );

                    if (!mensaje) {
                        mensaje = document.createElement("small");
                        mensaje.className = "campo-error";
                        mensaje.setAttribute("aria-live", "polite");
                        campo.insertAdjacentElement("afterend", mensaje);
                    }

                    // Limpia los errores personalizados anteriores.
                    campo.setCustomValidity("");

                    // Obtiene el estado de validación del navegador.
                    const validez = campo.validity;

                    // Prepara el texto del error.
                    let textoError = "";

                    // Comprueba si el campo obligatorio está vacío.
                    if (validez.valueMissing) {

                        textoError = campo.type === "checkbox"
                            ? "Debes aceptar esta opción."
                            : "Este campo es obligatorio.";

                    } else if (validez.typeMismatch && campo.type === "email") {

                        // Comprueba que el correo tenga un formato válido.
                        textoError = "Ingresa un correo electrónico válido.";

                    } else if (validez.typeMismatch && campo.type === "url") {

                        // Comprueba que la dirección web sea válida.
                        textoError = "Ingresa una dirección web válida.";

                    } else if (validez.tooShort) {

                        // Comprueba la longitud mínima del texto.
                        textoError = "El texto es demasiado corto.";

                    } else if (validez.tooLong) {

                        // Comprueba la longitud máxima del texto.
                        textoError = "El texto supera la longitud permitida.";

                    } else if (validez.rangeUnderflow) {

                        // Comprueba que el número no sea menor al mínimo.
                        textoError = "El valor debe ser mayor o igual a " + campo.min + ".";

                    } else if (validez.rangeOverflow) {

                        // Comprueba que el número no supere el máximo.
                        textoError = "El valor no debe superar " + campo.max + ".";

                    } else if (validez.stepMismatch) {

                        // Comprueba que el número respete el intervalo permitido.
                        textoError = "Ingresa un valor válido.";

                    } else if (validez.badInput) {

                        // Comprueba que el valor tenga un formato numérico correcto.
                        textoError = "Ingresa un valor válido.";

                    }

                    // Comprueba los campos numéricos negativos cuando tienen min=0.
                    if (
                        textoError === "" &&
                        campo.type === "number" &&
                        campo.min === "0" &&
                        campo.value !== "" &&
                        Number(campo.value) < 0
                    ) {
                        textoError = "El valor no puede ser negativo.";
                    }

                    // Si existe un error, lo muestra debajo del campo.
                    if (textoError !== "") {

                        campo.classList.add("campo-invalido");
                        campo.classList.remove("campo-valido");

                        mensaje.textContent = textoError;
                        mensaje.style.display = "block";

                        campo.setAttribute("aria-invalid", "true");

                    } else {

                        // Limpia el mensaje cuando el campo es válido.
                        campo.classList.remove("campo-invalido");
                        campo.removeAttribute("aria-invalid");

                        mensaje.textContent = "";
                        mensaje.style.display = "none";

                        // Marca como válido únicamente si contiene información.
                        if (campo.value !== "") {
                            campo.classList.add("campo-valido");
                        } else {
                            campo.classList.remove("campo-valido");
                        }

                    }

                }

            });

        </script>

    </th:block>

</body>
</html>
