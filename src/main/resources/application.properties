
# ==========================================
# CONFIGURACIÓN GENERAL DE SIVET
# ==========================================

# Nombre de la aplicación
spring.application.name=SIVET

# ==========================================
# CONEXIÓN A POSTGRESQL
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/sivet_db
spring.datasource.username=postgres
spring.datasource.password=Postgre25

# ==========================================
# CONFIGURACIÓN DE HIBERNATE Y JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================

server.port=8080

# ==========================================
# MENSAJES PERSONALIZADOS DE SIVET
# ==========================================

# Archivo donde se encuentran los mensajes.
spring.messages.basename=messages

# Codificación para caracteres especiales y tildes.
spring.messages.encoding=UTF-8

# Clave secreta para firmar los tokens JWT.
sivet.jwt.secret=${SIVET_JWT_SECRET:MiClaveSecretaSIVET2026SuperSegura123}

# Logs temporales para diagnosticar la seguridad
logging.level.org.springframework.security=TRACE

# Mostrar los endpoints registrados por Spring MVC
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE