# ==========================================
# CONFIGURACIÓN GENERAL DE SIVET
# ==========================================

# Nombre de la aplicación
spring.application.name=SIVET

# ==========================================
# CONEXIÓN A POSTGRESQL LOCAL
# ==========================================

# Dirección de la base de datos
spring.datasource.url=${SIVET_DB_URL:jdbc:postgresql://localhost:5432/sivet_db}

# Usuario de PostgreSQL
spring.datasource.username=${SIVET_DB_USERNAME:postgres}

# Contraseña de PostgreSQL local
spring.datasource.password=${SIVET_DB_PASSWORD}

# ==========================================
# CONFIGURACIÓN DE HIBERNATE Y JPA
# ==========================================

# Actualiza automáticamente las tablas durante el desarrollo
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true

# Organiza las consultas SQL para facilitar su lectura
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================

server.port=8080

# ==========================================
# CONFIGURACIÓN DE MENSAJES
# ==========================================

# Archivo donde se encuentran los mensajes personalizados
spring.messages.basename=messages

# Codificación para caracteres especiales y tildes
spring.messages.encoding=UTF-8

# ==========================================
# CONFIGURACIÓN JWT
# ==========================================

# Clave secreta obtenida desde una variable de entorno
sivet.jwt.secret=${SIVET_JWT_SECRET}

# ==========================================
# CONFIGURACIÓN DE REGISTROS (LOGS)
# ==========================================

# Nivel de registro de Spring Security
logging.level.org.springframework.security=DEBUG

# Muestra información sobre los endpoints registrados
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# Registro de errores en archivo
logging.file.name=logs/sivet.log

# Niveles de registro
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.sivet=DEBUG